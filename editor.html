<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COMP3421 · Live Editor</title>
  <link rel="stylesheet" href="assets/editor.css" />
</head>
<body>
  <div class="topbar">
    <a class="btn" id="back" href="index.html" title="Back to index">← Index</a>
    <span class="brand">COMP3421 Live Editor</span>
    <span class="crumb"><span id="crumb-cat">…</span> / <span id="crumb-ex">…</span></span>
    <span class="spacer"></span>
    <label><input type="checkbox" id="auto" checked /> Auto-run</label>
    <button class="btn" id="download" title="Download all files of this example as a .zip (including your edits)">⬇ Download .zip</button>
    <button class="btn primary" id="run">▶ Run</button>
  </div>

  <div class="split">
    <div class="pane editor">
      <div class="pane-title">Source <span class="crumb" id="file-hint"></span></div>
      <div class="tabs" id="tabs"></div>
      <div class="editor-host" id="editor-host"></div>
    </div>
    <div class="divider" id="divider" title="Drag to resize the preview"></div>
    <div class="pane preview">
      <div class="pane-title">
        <span>Result <span class="size" id="preview-size"></span></span>
        <a class="open-tab" id="open-tab" href="#" target="_blank" rel="noopener" title="Open this HTML in a new browser tab">↗ Open in new tab</a>
      </div>
      <iframe class="preview-frame" id="preview-frame" title="Result"></iframe>
    </div>
  </div>

  <footer class="site-footer">
    <span>&copy; 2026 COMP3421 Web Application Design and Development · The Hong Kong Polytechnic University</span>
    <span class="sep">|</span>
    <span>Dr. Lei Yang (Ray) · <a href="mailto:ray.yang@polyu.edu.hk">ray.yang@polyu.edu.hk</a></span>
  </footer>

  <script src="vendor/codemirror.bundle.js"></script>
  <script src="assets/stored-zip.js"></script>
  <script src="assets/editor.js"></script>
</body>
</html>
