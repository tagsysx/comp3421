<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hoisting — what moves to the top</title>
</head>
<body>
  <h2>Hoisting</h2>
  <p>
    A function declaration is usable before the line it is written on. A function
    expression is not: only its variable is hoisted, and with <code>let</code> or
    <code>const</code> even that stays unusable — the temporal dead zone.
    The same lines appear in the editor's <b>Console</b> tab, and below.
  </p>
  <pre id="out"></pre>
  <script src="script.js"></script>
</body>
</html>
