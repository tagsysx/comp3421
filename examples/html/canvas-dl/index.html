<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Canvas & definition lists</title>
</head>
<body>
  <h1>Canvas &amp; definition lists</h1>

  <!-- Canvas: a drawing surface for JavaScript -->
  <canvas id="myCanvas" width="220" height="120"
          style="border:1px solid #999;"></canvas>

  <!-- Definition list: term + description -->
  <dl>
    <dt>HTML</dt>
    <dd>HyperText Markup Language — the structure of a page.</dd>
    <dt>CSS</dt>
    <dd>Cascading Style Sheets — the presentation.</dd>
    <dt>JavaScript</dt>
    <dd>The behaviour of the page.</dd>
  </dl>
</body>
</html>
