<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Semantic page</title>
</head>
<body>
  <!-- Landmarks: header, nav, main, aside, footer -->
  <header>
    <h1>My Site</h1>
    <p>The top banner — logo and site title.</p>
  </header>

  <nav>
    <a href="#">Home</a> |
    <a href="#">About</a> |
    <a href="#">Contact</a>
  </nav>

  <main>
    <!-- A self-contained piece of content -->
    <article>
      <h2>A blog post</h2>
      <p>An <code>&lt;article&gt;</code> is a self-contained unit.</p>
    </article>

    <!-- A thematic section -->
    <section>
      <h3>Related reading</h3>
      <p>A <code>&lt;section&gt;</code> groups thematically related content.</p>
    </section>
  </main>

  <aside>
    <h4>Sidebar</h4>
    <p>Related but separate content — <code>&lt;aside&gt;</code>.</p>
  </aside>

  <footer>
    <p>&copy; 2026 My Site — the <code>&lt;footer&gt;</code>.</p>
  </footer>
</body>
</html>
