<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Form controls</title>
</head>
<body>
  <h2>Contact form</h2>
  <form>
    <label>Name: <input type="text" placeholder="Your name" /></label><br /><br />
    <label>Email: <input type="email" placeholder="you@example.com" /></label><br /><br />
    <label>Year:
      <select>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
      </select>
    </label><br /><br />
    <label>Subscribe <input type="checkbox" checked /></label><br /><br />
    <button type="submit">Submit</button>
  </form>
</body>
</html>
