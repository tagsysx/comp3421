<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Lists &amp; tables</title>
</head>
<body>
  <h1>Lists and tables</h1>

  <!-- Unordered list: bullets -->
  <ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
  </ul>

  <!-- Ordered list: numbers -->
  <ol>
    <li>Write the HTML</li>
    <li>Style with CSS</li>
    <li>Add behaviour with JavaScript</li>
  </ol>

  <!-- Nested list: an outline or menu -->
  <ul>
    <li>Front-end
      <ul>
        <li>HTML</li>
        <li>CSS</li>
      </ul>
    </li>
    <li>Back-end
      <ul>
        <li>Node.js</li>
        <li>Express</li>
      </ul>
    </li>
  </ul>

  <!-- Table: header cells + data cells -->
  <table border="1">
    <tr>
      <th>Name</th>
      <th>Mark</th>
    </tr>
    <tr>
      <td>Ada</td>
      <td>95</td>
    </tr>
    <tr>
      <td>Lin</td>
      <td>88</td>
    </tr>
  </table>
</body>
</html>
