<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Image map — clickable regions</title>
</head>
<body>
  <h1>Image map</h1>
  <p>Click the computer, the phone, or the cup of coffee — each region
     goes to its own page.</p>

  <!-- usemap links this image to the <map> below -->
  <img src="workplace.jpg" alt="Workplace" usemap="#workmap" width="400" height="379" />

  <!-- the map defines clickable regions with coordinates -->
  <map name="workmap">
    <area shape="rect"   coords="34,44,270,350"   alt="Computer"      href="computer.html" />
    <area shape="rect"   coords="290,172,333,250" alt="Phone"         href="phone.html" />
    <area shape="circle" coords="337,300,44"      alt="Cup of coffee" href="coffee.html" />
  </map>
</body>
</html>
