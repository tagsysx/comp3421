<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transitions</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h2>transition: width 2s, height 4s</h2>

  <div class="box">hover me</div>

  <p class="note">Hover the box. The width takes 2 seconds, the height takes 4 &mdash;
     one change, two speeds. Delete <code>transition</code> and both snap in an instant.</p>

</body>
</html>
