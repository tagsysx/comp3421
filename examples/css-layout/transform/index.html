<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSS transforms</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h2>CSS transforms</h2>
  <div class="row">
    <div class="box t1">translate</div>
    <div class="box t2">rotate</div>
    <div class="box t3">scale</div>
    <div class="box t4">skew</div>
  </div>
  <p class="hint">Hover any box — the transform changes. Try editing the values.</p>
</body>
</html>
