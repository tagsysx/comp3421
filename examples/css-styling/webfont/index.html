<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Web fonts — Google Fonts</title>
  <!-- Load three custom fonts from Google Fonts (one <link>, three families) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Pacifico&family=Playfair+Display:ital,wght@1,700&display=swap"
        rel="stylesheet" />
</head>
<body>
  <h1 style="font-family: 'Pacifico', cursive; color: #185fa5; font-size: 2rem;">
    Pacifico — a handwritten font
  </h1>

  <p style="font-family: 'Roboto', sans-serif; font-size: 18px;">
    Roboto — a clean sans-serif for body text.
  </p>
  <p style="font-family: 'Roboto', sans-serif; font-weight: 700;">
    Roboto bold — same family, heavier weight.
  </p>

  <p style="font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 700; font-size: 1.3rem;">
    Playfair Display italic — an elegant serif.
  </p>

  <p style="font-family: system-ui, sans-serif; color: #666;">
    The fonts above are <em>not</em> on your computer — the browser downloads them from Google Fonts.
  </p>
</body>
</html>
