<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Length units</title>
</head>
<body>
  <h1 style="color: #185fa5;">Length units</h1>

  <p style="font-size: 16px;"><code>font-size: 16px;</code> — a fixed size in pixels</p>
  <p style="font-size: 1.5em;"><code>font-size: 1.5em;</code> — 1.5 &times; the parent's size</p>
  <p style="font-size: 1.5rem;"><code>font-size: 1.5rem;</code> — 1.5 &times; the root size</p>

  <div style="width: 50%; background: #eef3fb; padding: 8px; margin: 8px 0;">
    <code>width: 50%;</code> — half the parent's width
  </div>

  <div style="width: 100vw; background: #b9cdee; padding: 8px; margin: 8px 0;">
    <code>width: 100vw;</code> — the full viewport width
  </div>

  <div style="height: 20vh; background: #dbe7f7; padding: 8px; margin: 8px 0;">
    <code>height: 20vh;</code> — 20% of the viewport height
  </div>
</body>
</html>
