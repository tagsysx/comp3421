<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Backgrounds</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Backgrounds</h1>

  <div class="row">
    <div class="card color">
      <h2>background-color</h2>
      <p>A flat colour behind the content.</p>
    </div>

    <div class="card gradient">
      <h2>linear-gradient()</h2>
      <p>Two colours fading into each other.</p>
    </div>

    <div class="card radial">
      <h2>radial-gradient()</h2>
      <p>A circle of colour spreading outward.</p>
    </div>
  </div>

  <div class="hero">
    <h2>background-image + size + position</h2>
    <p>A repeating pattern image, tiled and centred.</p>
  </div>
</body>
</html>
