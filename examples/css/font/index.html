<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Font properties</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 class="serif">A serif heading</h1>
  <h2 class="sans">A sans-serif subheading</h2>

  <p class="big">This paragraph is big — <code>font-size: 20px</code>.</p>
  <p class="em">This paragraph uses <code>em</code> — <code>font-size: 1.5em</code>.</p>

  <p class="italic">Italic text.</p>
  <p class="bold">Bold text.</p>
  <p class="weight">A numeric weight (<code>font-weight: 300</code>).</p>
  <p class="caps">Small-caps text.</p>

  <p class="short">This line uses the <code>font</code> shorthand.</p>
</body>
</html>
