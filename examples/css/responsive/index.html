<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- without this line, phones render at desktop width and zoom out -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive design</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>Responsive design</h1>
  </header>

  <div class="grid">
    <div class="card">Card one — resize the window and watch these reflow.</div>
    <div class="card">Card two — the columns collapse on narrow screens.</div>
    <div class="card">Card three — a fluid grid that adapts to any width.</div>
  </div>

  <p class="hint">Resize this preview, or open it on a phone, to trigger the breakpoint at <code>600px</code>.</p>
</body>
</html>
