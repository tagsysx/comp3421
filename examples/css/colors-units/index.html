<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Colours &amp; units</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="hero">
    <h1>Colours &amp; units</h1>
  </section>

  <div class="swatches">
    <span class="sw sw-named">named</span>
    <span class="sw sw-hex">#185fa5</span>
    <span class="sw sw-rgb">rgb()</span>
    <span class="sw sw-rgba">rgba()</span>
    <span class="sw sw-hsl">hsl()</span>
  </div>

  <p class="px">This text is a fixed size (<code>px</code>).</p>
  <p class="rem">This text uses <code>rem</code> — relative to the root.</p>
  <p class="em">This text uses <code>em</code> — relative to its parent.</p>

  <div class="half">This box is <code>width: 50%</code> of its parent.</div>
  <div class="vh">This box is <code>height: 20vh</code> of the viewport.</div>
</body>
</html>
