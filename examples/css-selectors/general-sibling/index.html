<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>General sibling selector</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>General sibling selector</h1>

  <p>Not matched — this paragraph comes before <code>.abc</code>.</p>

  <div class="abc">Title</div>
  <p>first — matched</p>
  <p>second — matched too</p>
  <p>third — every later sibling is matched, not only the next one.</p>
</body>
</html>
