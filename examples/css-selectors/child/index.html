<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Child selector</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Child selector</h1>

  <div class="abc">
    <p>a direct child — matched</p>
    <div>
      <p>a grandchild — not a child of .abc, so not matched</p>
    </div>
  </div>

  <p>Outside <code>.abc</code> — not matched either.</p>
</body>
</html>
