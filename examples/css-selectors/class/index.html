<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Class selector</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Class selector</h1>

  <p class="center large">Two classes, one tag — <code>class="center large"</code>.</p>
  <h2 class="center">Also centred</h2>
  <p class="center">Any element carrying <code>class="center"</code> is centred.</p>
  <p>No class here, so this paragraph keeps the browser's own look.</p>

  <p><small><code>p.center</code> is blue — and the <code>&lt;h2&gt;</code> is not, because that
  rule is tagged down to paragraphs.</small></p>
</body>
</html>
