<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ID selector</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>ID selector</h1>

  <p id="para1">Only one element can carry this id — <code>#para1</code> is written in the HTML.</p>

  <p>This paragraph has no id, so no rule in style.css matches it.</p>
</body>
</html>
