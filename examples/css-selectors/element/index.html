<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Element selector</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Element selector</h1>

  <p>This paragraph is centred and blue — the rule <code>p</code> found it.</p>
  <p>So is this one. Every paragraph on the page matches, wherever it sits.</p>

  <section>
    <p>Even inside a section: the element selector does not care where an element is.</p>
  </section>

  <p><small>The heading above is untouched — <code>p</code> matches paragraphs only.</small></p>
</body>
</html>
