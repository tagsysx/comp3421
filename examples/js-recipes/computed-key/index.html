<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Objects</h1>
<h2>A key you compute</h2>

<p>Inside an object literal, [expression] becomes the property name.</p>

<p id="demo"></p>

<script>
const key = "score";
const board = { [key]: 10 };

document.getElementById("demo").innerHTML =
  "key = " + key +
  "<br>board = " + JSON.stringify(board) +
  "<br>board[key] = " + board[key];
</script>

</body>
</html>
