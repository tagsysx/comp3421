<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Functions</h1>
<h2>Pipe two functions</h2>

<p>pipe(f, g)(x) is g(f(x)): the output of the first function feeds the second.</p>

<p id="demo"></p>

<script>
const pipe = (f, g) => x => g(f(x));

const incThenTimes10 = pipe(n => n + 1, n => n * 10);

document.getElementById("demo").innerHTML =
  "pipe(n => n + 1, n => n * 10)(4)  →  " + pipe(n => n + 1, n => n * 10)(4) +
  "<br>step by step: 4 → " + (4 + 1) + " → " + (4 + 1) * 10;
</script>

</body>
</html>
