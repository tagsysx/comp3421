<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Events</h1>
<h2>Stop a form from reloading</h2>

<p>Submit the form: without preventDefault the page would reload.</p>

<form id="form"><input id="name" value="Ada"> <button>Send</button></form>
<p id="demo">Submit the form — the page does not reload.</p>

<script>
const form = document.getElementById("form");

form.addEventListener("submit", e => {
  e.preventDefault();
  document.getElementById("demo").textContent =
    "sent: " + document.getElementById("name").value;
});
</script>

</body>
</html>
