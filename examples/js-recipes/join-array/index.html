<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Arrays</h1>
<h2>Array to string</h2>

<p>join(" · ") glues the items together with a separator:</p>

<p id="demo"></p>

<script>
const text = ["a", "b", "c"].join(" · ");

// a · b · c
document.getElementById("demo").textContent = text;
</script>

</body>
</html>
