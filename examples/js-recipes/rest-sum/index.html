<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Functions</h1>
<h2>Sum anything you pass</h2>

<p>...nums collects every argument into a real array, so reduce() works on it directly.</p>

<p id="demo"></p>

<script>
const sum = (...nums) =>
  nums.reduce((a, b) => a + b, 0);

document.getElementById("demo").innerHTML =
  "sum(1, 2, 3)  →  " + sum(1, 2, 3) +
  "<br>sum(4, 5)  →  " + sum(4, 5);
</script>

</body>
</html>
