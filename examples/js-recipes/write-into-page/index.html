<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Can Change the Page</h1>
<h2>Write into the page</h2>

<p>Find the element with getElementById, then assign HTML to its innerHTML.</p>

<p id="demo">JavaScript can change the page.</p>

<script>
const demo = document.getElementById("demo");
demo.innerHTML = "<b>Hello</b>";
</script>

</body>
</html>
