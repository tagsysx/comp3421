<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Reacts to Events</h1>
<h2>React to a click</h2>

<p>Give the button an onclick handler; it runs every time the button is clicked.</p>

<p id="demo">Waiting for a click…</p>
<button id="go">Click me</button>

<script>
const demo = document.getElementById("demo");
const btn = document.querySelector("#go");
btn.onclick = () => demo.textContent = "Clicked!";
</script>

</body>
</html>
