<!DOCTYPE html>
<html>
<body>

<h1>The Browser Object Model</h1>
<h2>Remember a setting</h2>

<p>localStorage stores strings in the browser; they survive a reload or a new tab on the same site.</p>

<p><button id="save">Save theme = dark</button> <button id="clear">Clear it</button></p>
<p id="demo"></p>

<script>
const demo = document.getElementById("demo");
const show = () => {
  const theme = localStorage.getItem("theme");
  demo.textContent = theme === null
    ? 'no theme saved — click "Save theme"'
    : 'theme = "' + theme + '"  (reload the page: it is still there)';
};

localStorage.setItem("theme", "dark");   // the recipe's two lines
show();

document.getElementById("save").onclick = () => { localStorage.setItem("theme", "dark"); show(); };
document.getElementById("clear").onclick = () => { localStorage.removeItem("theme"); show(); };
</script>

</body>
</html>
