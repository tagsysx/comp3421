<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Strings</h1>
<h2>String to array</h2>

<p>split(",") cuts a string at every comma:</p>

<p id="demo"></p>

<script>
const parts = "a,b,c".split(",");

// ["a", "b", "c"]
document.getElementById("demo").textContent = JSON.stringify(parts);
</script>

</body>
</html>
