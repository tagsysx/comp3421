<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Freeze the context</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; color: #1a2230; }
  h2   { margin: 0 0 6px; font-size: 20px; }
  p.note { margin: 0 0 16px; color: #4a5568; font-size: 13px; line-height: 1.5; }
  h3   { margin: 18px 0 6px; font-size: 11px; letter-spacing: .08em;
         text-transform: uppercase; color: #7a8699; }
  pre  { margin: 0; padding: 12px 14px; border-radius: 6px; font-size: 13px;
         line-height: 1.55; overflow-x: auto; }
  pre.code { background: #1f2430; color: #e8eef7; }
  #out { background: #f6f8fb; border: 1px solid #dde1e7; }
  .trap { background: #fff3d6; border-left: 4px solid #b8860b; padding: 8px 12px;
           margin: 14px 0 0; font-size: 13px; }
</style>
</head>
<body>

<h2>Freeze the context</h2>
<p class="note">bind returns a new function with this already decided — the usual cure for a callback that loses it.</p>

<h3>On the slide</h3>
<pre class="code">const greetAda = user.greet.bind(user);
setTimeout(greetAda, 100);</pre>

<h3>What it prints</h3>
<pre id="out"></pre>

<div class="trap">loose() 在浏览器里得到「Hi, undefined」：this 变成了 window，所以没有 name。bind 之后才可靠。</div>
<script>
const out = [];
function render() { document.getElementById("out").textContent = out.join("\n"); }
function log(label, value) {
  out.push(String(label).padEnd(30) + "  " + value);
  render();
}

const user = {
  name: "Ada",
  greet() { return "Hi, " + this.name; }
};

const loose = user.greet;
const greetAda = user.greet.bind(user);

log("user.greet()", user.greet());
log("loose()", loose());
log("greetAda()", greetAda());
log("greetAda.call({name:'Bob'})", greetAda.call({ name: "Bob" }));

setTimeout(() => {
  log("after 10 ms, bound", greetAda());
  log("after 10 ms, unbound", loose());
}, 10);
</script>

</body>
</html>
