<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Days between two dates</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; color: #1a2230; }
  h2   { margin: 0 0 6px; font-size: 20px; }
  p.note { margin: 0 0 16px; color: #4a5568; font-size: 13px; line-height: 1.5; }
  h3   { margin: 18px 0 6px; font-size: 11px; letter-spacing: .08em;
         text-transform: uppercase; color: #7a8699; }
  pre  { margin: 0; padding: 12px 14px; border-radius: 6px; font-size: 13px;
         line-height: 1.55; overflow-x: auto; }
  pre.code { background: #1f2430; color: #e8eef7; }
  #out { background: #f6f8fb; border: 1px solid #dde1e7; }
  .trap { background: #fff3d6; border-left: 4px solid #b8860b; padding: 8px 12px;
           margin: 14px 0 0; font-size: 13px; }
</style>
</head>
<body>

<h2>Days between two dates</h2>
<p class="note">Subtracting dates gives milliseconds. Round, because a daylight-saving change makes one day 23 or 25 hours.</p>

<h3>On the slide</h3>
<pre class="code">const days = (a, b) =&gt; Math.round((b - a) / 86400000);</pre>

<h3>What it prints</h3>
<pre id="out"></pre>

<script>
const out = [];
function render() { document.getElementById("out").textContent = out.join("\n"); }
function log(label, value) {
  out.push(String(label).padEnd(30) + "  " + value);
  render();
}

const days = (a, b) => Math.round((b - a) / 86400000);
const jan = new Date(Date.UTC(2026, 0, 1));
const mar = new Date(Date.UTC(2026, 2, 1));

log("1 Jan -> 1 Mar 2026", days(jan, mar));
log("the other way", days(mar, jan));
log("raw milliseconds", mar - jan);
log("Date.UTC is stable", jan.toISOString());
log("a local Date is not", new Date(2026, 0, 1).getTimezoneOffset() + " min offset");
</script>

</body>
</html>
