<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cut a long line</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; color: #1a2230; }
  h2   { margin: 0 0 6px; font-size: 20px; }
  p.note { margin: 0 0 16px; color: #4a5568; font-size: 13px; line-height: 1.5; }
  h3   { margin: 18px 0 6px; font-size: 11px; letter-spacing: .08em;
         text-transform: uppercase; color: #7a8699; }
  pre  { margin: 0; padding: 12px 14px; border-radius: 6px; font-size: 13px;
         line-height: 1.55; overflow-x: auto; }
  pre.code { background: #1f2430; color: #e8eef7; }
  #out { background: #f6f8fb; border: 1px solid #dde1e7; }
  .trap { background: #fff3d6; border-left: 4px solid #b8860b; padding: 8px 12px;
           margin: 14px 0 0; font-size: 13px; }
</style>
</head>
<body>

<h2>Cut a long line</h2>
<p class="note">The ellipsis is one character counting toward the length you asked for.</p>

<h3>On the slide</h3>
<pre class="code">const clip = (s, n) =&gt; s.length &gt; n ? s.slice(0, n) + &quot;…&quot; : s;</pre>

<h3>What it prints</h3>
<pre id="out"></pre>

<script>
const out = [];
function render() { document.getElementById("out").textContent = out.join("\n"); }
function log(label, value) {
  out.push(String(label).padEnd(30) + "  " + value);
  render();
}

const clip = (s, n) => s.length > n ? s.slice(0, n) + "…" : s;

log('clip("JavaScript", 4)', clip("JavaScript", 4));
log("its length", clip("JavaScript", 4).length);
log('clip("JS", 4)', clip("JS", 4));
log('clip("JavaScript", 4) vs 5', clip("JavaScript", 5));
log("note", "slice is safe past the end: it just stops");
</script>

</body>
</html>
