<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Shadow the prototype</title>
</head>
<body>
  <h2>Shadow the prototype</h2>
  <p>
    A shared value lives on the prototype; assigning the same name on one object
    gives that object its own copy, and the prototype is untouched. The same lines
    appear in the editor's <b>Console</b> tab, and below.
  </p>
  <pre id="out"></pre>
  <script src="script.js"></script>
</body>
</html>
