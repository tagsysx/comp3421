<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inherit without classes</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; color: #1a2230; }
  h2   { margin: 0 0 6px; font-size: 20px; }
  p.note { margin: 0 0 16px; color: #4a5568; font-size: 13px; line-height: 1.5; }
  h3   { margin: 18px 0 6px; font-size: 11px; letter-spacing: .08em;
         text-transform: uppercase; color: #7a8699; }
  pre  { margin: 0; padding: 12px 14px; border-radius: 6px; font-size: 13px;
         line-height: 1.55; overflow-x: auto; }
  pre.code { background: #1f2430; color: #e8eef7; }
  #out { background: #f6f8fb; border: 1px solid #dde1e7; }
  .trap { background: #fff3d6; border-left: 4px solid #b8860b; padding: 8px 12px;
           margin: 14px 0 0; font-size: 13px; }
</style>
</head>
<body>

<h2>Inherit without classes</h2>
<p class="note">Object.create(animal) makes a new object whose prototype is animal: no constructor, no new.</p>

<h3>On the slide</h3>
<pre class="code">const cat = Object.create(animal);
cat.name = &quot;Tom&quot;;
cat.speak();</pre>

<h3>What it prints</h3>
<pre id="out"></pre>

<script>
const out = [];
function render() { document.getElementById("out").textContent = out.join("\n"); }
function log(label, value) {
  out.push(String(label).padEnd(30) + "  " + value);
  render();
}

const animal = {
  speak() { return this.name + " makes a sound"; }
};
const cat = Object.create(animal);
cat.name = "Tom";

log("cat.speak()", cat.speak());
log("cat.hasOwnProperty('name')", cat.hasOwnProperty("name"));
log("cat.hasOwnProperty('speak')", cat.hasOwnProperty("speak"));
log("Object.keys(cat)", JSON.stringify(Object.keys(cat)));
log("up(cat) === animal", Object.getPrototypeOf(cat) === animal);
log("animal.name", String(animal.name));
</script>

</body>
</html>
