<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Loops</h1>
<h2>The for of Loop</h2>

<p>The for of statement loops through the values of any iterable object:</p>

<p id="demo"></p>

<script>
const cars = ["BMW", "Volvo", "Mini"];

let text = "";
for (let x of cars) {
  text += x + "<br>";
}

document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
