<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Functions</h1>
<h3>IIFE (Immediately Invoked Function Expression)</h3>
<p>Functions can be invoked automatically without being called:</p>

<p id="demo"></p>

<script>
(function () {
  document.getElementById("demo").innerHTML = "Hello! I called myself";
})();
</script>

</body>
</html>
