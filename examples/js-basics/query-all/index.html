<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>querySelector vs querySelectorAll</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; color: #1a2230; }
  h2   { margin: 0 0 6px; font-size: 20px; }
  p.note { margin: 0 0 18px; color: #4a5568; font-size: 13px; }
  .box { padding: 10px 14px; margin: 8px 0; background: #eef2f8;
         border-left: 4px solid #1e4fa8; }
  .hot { background: #fff3d6; border-left-color: #b8860b; }
  #out { background: #f6f8fb; border: 1px solid #dde1e7; padding: 10px;
         font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>

<h2>One element, or all of them</h2>
<p class="note">The first box is styled on its own; then every box is looped over.</p>

<div class="box" id="box1">box1</div>
<div class="box" id="box2">box2</div>
<div class="box" id="box3">box3</div>

<pre id="out"></pre>

<script>
// querySelector returns ONE element - the first match in the document.
const first = document.querySelector(".box");
first.style.fontSize = "22px";
first.classList.add("hot");

// querySelectorAll returns EVERY match, inside a NodeList.
const all = document.querySelectorAll(".box");

// The list itself has no .style. This is the classic mistake:
// it is not an element, it is a container of elements.
document.getElementById("out").textContent =
  "first.id          : " + first.id + "\n" +
  "all.length        : " + all.length + "\n" +
  "typeof all.style  : " + typeof all.style;

// To reach all of them, loop. forEach works on a NodeList.
all.forEach((el) => el.classList.add("hot"));
</script>

</body>
</html>
