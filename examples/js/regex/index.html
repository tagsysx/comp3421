<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Regular Expressions — the symbols</title>
</head>
<body>
  <h2>Regular expressions</h2>
  <p>
    Every line is <b>pattern</b> · <b>subject</b> · <b>what it found</b>.
    A pattern in slashes is a literal; the letters after the closing slash are flags
    (<code>g</code> every match, <code>i</code> ignore case, <code>m</code> ^ and $ per line).
    The same lines appear in the editor's <b>Console</b> tab, and below.
  </p>
  <pre id="out"></pre>
  <script src="script.js"></script>
</body>
</html>
